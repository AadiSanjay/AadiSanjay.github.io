    <text x="84" y="120" class="n">5</text><text x="104" y="120"><tspan class="k">    let</tspan><tspan class="p"> id = </tspan><tspan class="t">UUID</tspan><tspan class="p">()</tspan></text>
    <text x="84" y="150" class="n">6</text><text x="104" y="150"><tspan class="k">    var</tspan><tspan class="p"> text: </tspan><tspan class="t">String</tspan></text>
    <text x="84" y="180" class="n">7</text><text x="104" y="180"><tspan class="k">    var</tspan><tspan class="p"> photo: </tspan><tspan class="t">Data</tspan><tspan class="p">?</tspan></text>
    <text x="84" y="210" class="n">8</text><text x="104" y="210"><tspan class="k">    var</tspan><tspan class="p"> opensOn: </tspan><tspan class="t">Date</tspan></text>
    <text x="84" y="240" class="n">9</text><text x="104" y="240" class="p">}</text>
