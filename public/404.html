<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key not found · Aadi Sanjay</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4efe5;
        background-image: radial-gradient(#1d1b1918 1px, transparent 1.3px);
        background-size: 22px 22px;
        color: #1f1c19;
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
        text-align: center;
        padding: 16px;
      }
      .cap {
        display: inline-grid;
        place-items: center;
        width: 96px;
        height: 96px;
        border-radius: 14px;
        background: #7a1620;
        box-shadow: 0 6px 0 #4d0d14;
        position: relative;
        margin-bottom: 2rem;
      }
      .cap span {
        position: absolute;
        inset: 8px 12px 20px;
        border-radius: 10px;
        background: linear-gradient(170deg, #c23a45, #b3222e 60%);
        color: #f2c94c;
        font-weight: 700;
        font-size: 1.6rem;
        display: grid;
        place-items: center;
      }
      p {
        color: #6b6357;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.9rem;
      }
      a {
        color: #981b26;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="cap" aria-hidden="true"><span>404</span></div>
      <h1>Key not found.</h1>
      <p>That page isn't mapped to anything. <a href="/">Back to the keyboard</a></p>
    </main>
  </body>
</html>
