<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aadi Sanjay</title>
    <meta name="description" content="Aadi Sanjay's projects, on a keyboard." />
  </head>
  <body>
    <main id="desk" class="desk">
      <header class="intro">
        <h1>Aadi Sanjay</h1>
        <p>CS + Econ at UIUC. I build browser extensions, apps, and keyboards.</p>
      </header>

      <div class="display" data-display aria-live="polite">
        <p class="idle">
          type a key with a <span class="dot" aria-hidden="true"></span> to open a project.<br />
          hold <kbd>shift</kbd> (or click <kbd>fn</kbd>) for about, experience, contact, resume, and my other builds.
        </p>
      </div>

      <div class="board" data-board role="group" aria-label="My keyboard. Keys marked with a dot open projects."></div>

      <div class="controls">
        <fieldset class="builds" data-builds>
          <legend>try my other builds</legend>
        </fieldset>
        <button type="button" data-sound aria-pressed="true">sound: on</button>
        <button type="button" data-list-toggle aria-expanded="false" aria-controls="work-list">just show me a list</button>
      </div>

      <section id="work-list" class="work-list" data-list hidden>
        <h2>Work</h2>
        <ul></ul>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
